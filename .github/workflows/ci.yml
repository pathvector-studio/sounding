name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Local-environment details and secrets must not reach the public repository (AGENTS.md 4.3).
  private-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Files
        run: python3 scripts/check-private-info.py
      - name: Commits in this pull request (e-mails and messages)
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-private-info.py --commits "$RANGE"
      - name: All commits (e-mails and messages)
        if: github.event_name != 'pull_request'
        run: python3 scripts/check-private-info.py --commits HEAD
      # The binary, not gitleaks-action (which needs a license for organizations).
      - name: gitleaks (all history, values redacted)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner --log-opts=--all

  # VERSION is the one place the version is set (scripts/version.py); a release tag must be v$(cat VERSION).
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every copy matches VERSION
        if: github.ref_type != 'tag'
        run: python3 scripts/version.py check
      - name: The tag matches VERSION
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/version.py check --tag "$TAG"

  # The compose file stays valid with the dummy values of .env.example.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env && docker compose config -q
      - name: Build the backend image
        run: docker build --build-context repo=. backend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sounding_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sounding_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - run: uv sync --frozen
      - name: Run tests (integration tests must not be skipped; includes the models-vs-migration check)
        run: |
          uv run pytest -q -rs -p no:cacheprovider | tee pytest.log
          if grep -qi "skipped" pytest.log; then echo "::error::tests were skipped"; exit 1; fi

  # install.sh (served through https://sounding.pathvector.dev/install.sh from the latest Release): lint, then
  # prepare an install of this commit without a terminal and without starting anything.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install.sh scripts/backup.sh scripts/restore.sh
      - name: A prepare-only install writes the env file and the profile
        env:
          SOUNDING_DIR: ${{ runner.temp }}/sounding
          SOUNDING_NO_START: "1"
          SOUNDING_NONINTERACTIVE: "1"
        run: |
          git switch -c ci-install
          SOUNDING_REPO="file://$PWD" SOUNDING_REF=ci-install bash install.sh
          env_file="$SOUNDING_DIR/.env"
          test "$(stat -c %a "$env_file")" = 600
          test -f "$SOUNDING_DIR/config/profile.yaml"
          test "$(grep -cE '^(POSTGRES_PASSWORD|WEB_DB_PASSWORD|SESSION_SECRET|IDENTITY_SECRET)=[0-9a-f]{64}$' "$env_file")" = 4
          # A second run leaves the env file alone.
          before="$(sha256sum < "$env_file")"
          SOUNDING_REPO="file://$PWD" SOUNDING_REF=ci-install bash install.sh
          test "$(sha256sum < "$env_file")" = "$before"

  # The frontend job is added with its code (docs/DESIGN.md §9).
