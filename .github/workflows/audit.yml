# Known-vulnerability and license check for production dependencies. Runs on every PR / push to main
# and weekly, so advisories published after a merge are noticed without a code change.
name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - name: pip-audit (production dependencies from uv.lock)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -q > requirements.txt
          uvx pip-audit@2.10.1 -r requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: Licenses of production dependencies (THIRD_PARTY_NOTICES.md)
        run: |
          uv sync --frozen --no-dev --no-install-project -q
          uv run --no-sync python ../scripts/check-licenses.py python
