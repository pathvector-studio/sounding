# Sounding — worker (fetch, summarize, digest) and web UI on PostgreSQL (docs/DESIGN.md §4.3).
name: sounding

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-build: &app-build
  context: ./backend
  additional_contexts:
    repo: .                     # the root VERSION file is copied into the image
  args:
    UID: ${APP_UID:-1000}
    GID: ${APP_GID:-1000}

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@sounding-db:5432/${POSTGRES_DB:?}
  TZ: ${TZ:-Asia/Tokyo}

x-app-common: &app-common
  build: *app-build
  image: sounding-app:local
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  depends_on:
    sounding-db:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  sounding-db:
    image: postgres:16
    container_name: ${SOUNDING_INSTANCE:-sounding}-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - sounding-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # Fetch (RSS / IETF lists) on a schedule and clear old bodies; later: select → summarize → deliver.
  # The only container that receives the whole .env (IDENTITY_SECRET, LLM keys, delivery settings).
  sounding-worker:
    <<: *app-common
    container_name: ${SOUNDING_INSTANCE:-sounding}-worker
    command: ["python", "-m", "sounding.worker"]
    env_file: .env
    environment: *app-env
    volumes:
      - ./config:/app/config:ro                     # profile.yaml
    networks:
      - sounding-internal
      - sounding-egress

  # Read-only UI, JSON API and Atom feed (phase 3). It reads the database and writes nothing.
  # Gets no env_file: only the values below, so no LLM key, IDENTITY_SECRET or delivery secret ever reaches it.
  sounding-web:
    <<: *app-common
    container_name: ${SOUNDING_INSTANCE:-sounding}-web
    command: ["python", "-m", "sounding.web"]
    environment:
      <<: *app-env
      WEB_PASSWORD_HASH: ${WEB_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      PROFILE_PATH: ${PROFILE_PATH:-config/profile.yaml}   # UI labels follow profile.language
      LLM_PROVIDER: ${LLM_PROVIDER:-none}                    # shown on the status page
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-1.00}
    volumes:
      - ./config:/app/config:ro                     # profile.yaml
    ports:
      - "127.0.0.1:${SOUNDING_PORT:-8080}:8080"
    networks:
      - sounding-internal
      - sounding-edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:

networks:
  sounding-internal:
    internal: true
  sounding-egress: {}
  sounding-edge: {}
