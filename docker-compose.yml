# Sounding — worker (fetch, summarize, digest) and web UI on PostgreSQL (docs/DESIGN.md §4.3).
name: sounding

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-build: &app-build
  context: ./backend
  additional_contexts:
    repo: .                     # the root VERSION file is copied into the image
  args:
    UID: ${APP_UID:-1000}
    GID: ${APP_GID:-1000}

x-app-env: &app-env
  TZ: ${TZ:-Asia/Tokyo}

x-app-common: &app-common
  build: *app-build
  image: sounding-app:local
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  depends_on:
    sounding-db:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  sounding-db:
    image: postgres:16
    container_name: ${SOUNDING_INSTANCE:-sounding}-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - sounding-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # Fetch (RSS / IETF lists) on a schedule and clear old bodies; later: select → summarize → deliver.
  # The only container that receives the whole .env (IDENTITY_SECRET, LLM keys, delivery settings).
  sounding-worker:
    <<: *app-common
    container_name: ${SOUNDING_INSTANCE:-sounding}-worker
    command: ["python", "-m", "sounding.worker"]
    env_file: .env
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@sounding-db:5432/${POSTGRES_DB:?}
    volumes:
      - ./config:/app/config:ro                     # profile.yaml
    networks:
      - sounding-internal
      - sounding-egress
    # Healthy once the migrations ran and the worker has set the web role's password (web waits for this).
    healthcheck:
      test: ["CMD", "python", "-m", "sounding.worker", "--healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Read-only UI, JSON API and Atom feed (phase 3). It reads the database and writes nothing.
  # Gets no env_file: only the values below, so no LLM key, IDENTITY_SECRET or delivery secret ever reaches it.
  # It connects as the read-only database role sounding_web (WEB_DB_PASSWORD), never as the owner.
  sounding-web:
    <<: *app-common
    container_name: ${SOUNDING_INSTANCE:-sounding}-web
    command: ["python", "-m", "sounding.web"]
    depends_on:
      sounding-db:
        condition: service_healthy
      sounding-worker:
        condition: service_healthy   # migrations done and the sounding_web password set
    environment:
      <<: *app-env
      DATABASE_URL: postgresql+psycopg://sounding_web:${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in .env (openssl rand -hex 32)}@sounding-db:5432/${POSTGRES_DB:?}
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      WEB_PASSWORD_HASH: ${WEB_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      PROFILE_PATH: ${PROFILE_PATH:-config/profile.yaml}   # UI labels follow profile.language
      LLM_PROVIDER: ${LLM_PROVIDER:-none}                    # shown on the status page
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-1.00}
    volumes:
      - ./config:/app/config:ro                     # profile.yaml
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SOUNDING_PORT:-8080}:8080"
    networks:
      - sounding-internal
      - sounding-edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional (deployment mode B, README 「公開のしかた」): open the UI on your tailnet over HTTPS.
  #   docker compose --profile tailscale up -d
  # Userspace networking (no NET_ADMIN, no tun), outbound only, no Funnel. Serves https://<TS_HOSTNAME>.<tailnet>.ts.net
  # -> http://sounding-web:8080. TS_AUTHKEY is only needed on the first start (state is kept in tailscale-state).
  # Not "${TS_AUTHKEY:?}": compose interpolates every service, so a required variable would break plain `up`.
  # Runs as root inside the container (containerboot writes its state volume and socket); all capabilities dropped.
  # On sounding-edge only, no env_file: it never sees the database, the LLM key or any other secret.
  sounding-tailscale:
    image: tailscale/tailscale:v1.104.2
    container_name: ${SOUNDING_INSTANCE:-sounding}-tailscale
    profiles: ["tailscale"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-sounding}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale-serve.json:/config/serve.json:ro
    networks:
      - sounding-edge
    depends_on:
      sounding-web:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

  # Optional (deployment mode C): publish through a Cloudflare Tunnel. Put Cloudflare Access in front first (README).
  #   docker compose --profile cloudflare up -d
  # Public hostname service in the dashboard: http://sounding-web:8080. Outbound only; on sounding-edge only, no env_file.
  sounding-cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    container_name: ${SOUNDING_INSTANCE:-sounding}-cloudflared
    profiles: ["cloudflare"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      # Not ":?" for the same reason as TS_AUTHKEY above; the container exits at once when it is empty.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - sounding-edge
    depends_on:
      sounding-web:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  tailscale-state:

networks:
  sounding-internal:
    internal: true
  sounding-egress: {}
  sounding-edge: {}
